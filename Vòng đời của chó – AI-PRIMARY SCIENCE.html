<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vòng đời của chó – AI-PRIMARY SCIENCE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&family=Cormorant+Garamond:wght@600;700&display=swap">
<style>
:root{--ivory:#F5F0E6;--milk:#FFFCF5;--sage:#8FAF9B;--moss:#3F6253;--gold:#D9C5A3;--caramel:#A87850;--pill:#FFFCF5;--ink:#3F6253;--panel:rgba(255,252,245,.94);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pill:#2f463b;--ink:#f1ead9;--panel:rgba(40,58,49,.95)}}
:root[data-theme="dark"]{--pill:#2f463b;--ink:#f1ead9;--panel:rgba(40,58,49,.95)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#e9efe3;font-family:'Be Vietnam Pro','Segoe UI',system-ui,sans-serif}
canvas{display:block;touch-action:none;cursor:grab}
.hd{position:fixed;left:18px;top:calc(12px + env(safe-area-inset-top,0px));pointer-events:none}
h1{margin:0;font:700 clamp(26px,4.6vw,46px)/1 'Cormorant Garamond',Georgia,serif;color:#fff;letter-spacing:.5px;text-shadow:0 2px 0 #e0457b,0 5px 14px rgba(0,60,90,.3)}
.hd p{margin:6px 0 0;font-size:clamp(11px,1.6vw,14px);color:#fff;font-weight:600;text-shadow:0 1px 6px rgba(0,60,90,.5)}
.hd p span{color:#fff3a8}
.tools{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:8px}
button{font:600 14px 'Be Vietnam Pro','Segoe UI',sans-serif;border:1.5px solid var(--ink);background:var(--pill);color:var(--ink);padding:7px 16px;border-radius:999px;cursor:pointer;box-shadow:0 2px 8px rgba(63,98,83,.18);transition:background .25s,color .25s}
button:focus-visible{outline:3px solid #D9C5A3;outline-offset:2px}
button.on{background:#ff4f7b;color:#fff;border-color:#ff4f7b}
.stg{position:fixed;left:0;right:0;bottom:calc(40px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 8px}
#info{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(94vw,580px);background:var(--panel);color:var(--ink);border-radius:18px;padding:12px 20px;font-size:15px;line-height:1.5;box-shadow:0 10px 28px rgba(63,98,83,.25);border:1px solid #D9C5A3}
#info b{display:block;font:700 24px 'Cormorant Garamond',Georgia,serif;color:#ff4f7b}
#info em{display:block;margin-top:6px;padding-top:6px;border-top:1px solid #D9C5A3;font-style:normal;font-weight:600;font-size:13px}
#lbs{position:fixed;inset:0;pointer-events:none}
.lb{position:absolute;left:0;top:0;text-align:center;white-space:nowrap;transition:opacity .4s}
.lb span{display:inline-block;background:var(--pill);color:var(--ink);border:1.5px solid #D9C5A3;border-radius:999px;padding:3px 14px;font:700 14px 'Be Vietnam Pro',sans-serif;box-shadow:0 2px 8px rgba(63,98,83,.2)}
.lb small{display:block;margin-top:3px;font-size:11px;font-weight:400;color:#3F6253;background:rgba(255,252,245,.85);border-radius:8px;padding:1px 8px;white-space:normal;max-width:190px;margin-inline:auto}
@media(max-width:600px){.lb small{display:none}.stg button{font-size:12px;padding:6px 10px}.tools button{font-size:12px;padding:6px 10px}#info{font-size:13px;bottom:calc(108px + env(safe-area-inset-bottom,0px))}.hd p span{display:none}}
.ft{position:fixed;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom,0px));text-align:center;font:600 15px 'Cormorant Garamond',Georgia,serif;color:#FFFCF5;text-shadow:0 1px 6px rgba(40,70,55,.8);pointer-events:none;letter-spacing:.5px}
</style>
</head>
<body>
<div class="hd"><h1>VÒNG ĐỜI CỦA CHÓ</h1><p>AI-PRIMARY SCIENCE <span>· Chó là động vật đẻ con, nuôi con bằng sữa mẹ</span></p></div>
<div class="tools"><button id="home">Toàn cảnh</button></div>
<div id="lbs"></div>
<div id="info" style="display:none"></div>
<div class="stg" id="stg"></div>
<div class="ft">Made by Như Quỳnh</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE,R=6.5,A=[0,1.55,2.85,4.71];
const scene=new T.Scene(),camera=new T.PerspectiveCamera(48,1,.1,300);
const renderer=new T.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const cvs=(w,h,f)=>{const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);return new T.CanvasTexture(c)};
scene.background=cvs(8,256,(x,w,h)=>{const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#4fb8f0');g.addColorStop(.55,'#b4ebf7');g.addColorStop(1,'#fff3c4');x.fillStyle=g;x.fillRect(0,0,w,h)});
scene.fog=new T.Fog(0xcdf0f6,40,100);
scene.add(new T.HemisphereLight(0xffffff,0x7bd45a,1.0));
const sun=new T.DirectionalLight(0xfff0cf,.95);sun.position.set(-10,22,10);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.radius=4;
Object.assign(sun.shadow.camera,{left:-16,right:16,top:16,bottom:-16,near:1,far:60});scene.add(sun);
let cur=null;
const M=(c,o={})=>{const m=new T.MeshStandardMaterial(Object.assign({color:c,roughness:.85},o));if(cur)cur.push({m,b:new T.Color(c)});return m};
const mesh=(g,m,x=0,y=0,z=0,p)=>{const o=new T.Mesh(g,m);o.position.set(x,y,z);(p||scene).add(o);return o};
const Sp=(r,w=16,h=12)=>new T.SphereGeometry(r,w,h);
const P=a=>new T.Vector3(R*Math.sin(a),0,-R*Math.cos(a));
let seed=5;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const std=c=>new T.MeshStandardMaterial({color:c,roughness:.9});

/* environment */
const gr=mesh(new T.CircleGeometry(90,64),std(0x56c457));gr.rotation.x=-Math.PI/2;gr.receiveShadow=true;
const d1=mesh(new T.CircleGeometry(11.5,64),std(0x86dc6a),0,.01,0);d1.rotation.x=-Math.PI/2;d1.receiveShadow=true;
const d2=mesh(new T.RingGeometry(R-.8,R+.8,80),std(0xffe08f),0,.02,0);d2.rotation.x=-Math.PI/2;d2.receiveShadow=true;
const FC=[0xff5f98,0xffd23f,0xb184ff,0xff9a3c];
function flower(p,x,z,s=1,c=FC[0]){const g=new T.Group();g.position.set(x,0,z);g.scale.setScalar(s);p.add(g);
  mesh(new T.CylinderGeometry(.02,.03,.35,6),std(0x5f8a6c),0,.18,0,g);
  for(let i=0;i<6;i++){const a=i*1.047,q=mesh(Sp(.07,8,6),M(c),Math.cos(a)*.08,.37,Math.sin(a)*.08,g);q.scale.y=.5}
  mesh(Sp(.05,8,6),M(0xd9b86a),0,.38,0,g)}
function tree(x,z,s,c){const g=new T.Group();g.position.set(x,0,z);g.scale.setScalar(s);scene.add(g);
  mesh(new T.CylinderGeometry(.3,.45,3),std(0x8a6a4a),0,1.5,0,g).castShadow=true;
  [[0,4.2,2.1],[1.1,3.5,1.5],[-1.1,3.7,1.4]].forEach((q,i)=>{const l=mesh(Sp(q[2],18,12),std(i?0x4cc86c:c),q[0],q[1],0,g);l.castShadow=true})}
[[-17,-12,1.5,0x2fa84f],[16,-14,1.7,0x1f9a5a],[-24,2,1.3,0x3cb85a],[25,-2,1.4,0x2fa84f],[-8,-24,1.8,0x1f9a5a],[9,-26,1.5,0x3cb85a],[0,-30,2,0x2fa84f]].forEach(a=>tree(...a));
for(let i=0;i<34;i++){const a=-Math.PI*.95+i*(Math.PI*1.9/33),r=14.5,f=new T.Group();
  f.position.set(Math.sin(a)*r,0,-Math.cos(a)*r);f.rotation.y=-a;scene.add(f);
  [0,.8].forEach(x=>mesh(new T.BoxGeometry(.14,1.1,.14),std(0xefe3c8),x,.55,0,f));
  [.35,.75].forEach(y=>mesh(new T.BoxGeometry(.95,.09,.05),std(0xefe3c8),.4,y,0,f))}
for(let i=0;i<70;i++){const a=rnd()*6.283,r=i<20?1+rnd()*3.5:12+rnd()*18;flower(scene,Math.cos(a)*r,Math.sin(a)*r,1+rnd()*.5,FC[i%4])}
const sp=new T.Sprite(new T.SpriteMaterial({map:cvs(128,128,x=>{const g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(255,248,215,1)');g.addColorStop(.3,'rgba(255,240,190,.7)');g.addColorStop(1,'rgba(255,240,190,0)');x.fillStyle=g;x.fillRect(0,0,128,128)}),fog:false}));
sp.scale.set(45,45,1);sp.position.set(-30,34,-55);scene.add(sp);
for(let i=0;i<5;i++){const s=mesh(new T.PlaneGeometry(2.5+rnd()*2,20),new T.MeshBasicMaterial({color:0xfff3c8,transparent:true,opacity:.09,depthWrite:false,blending:T.AdditiveBlending,side:T.DoubleSide}),-14+i*6+rnd()*3,9,-12-rnd()*8);s.rotation.z=-.35;s.rotation.y=.2}
const clouds=[];for(let i=0;i<6;i++){const c=new T.Group();for(let j=0;j<5;j++)mesh(Sp(1.5+rnd()*1.2,12,8),new T.MeshBasicMaterial({color:0xfffcf5,transparent:true,opacity:.9}),j*1.7,rnd()*.5,rnd(),c);c.position.set(-55+i*20,22+rnd()*8,-45-rnd()*20);scene.add(c);clouds.push(c)}

/* dog builder (faces +z) */
function dog(o){const g=new T.Group(),c=M(o.c),lt=M(o.l||0xffecc2),ec=M(o.e||0xb5632a),k=M(0x1b1b1b,{roughness:.3});
  const L=o.legH,by=o.lying?.62:L+.3;
  const body=mesh(Sp(1,20,14),c,0,by,0,g);body.scale.set(.4,.38,.78);body.castShadow=true;
  mesh(Sp(.42,16,12),c,0,by+.04,.45,g).castShadow=true;mesh(Sp(.4,16,12),lt,0,by-.1,.2,g).scale.set(.8,.5,1.2);
  mesh(Sp(.27,14,10),c,0,by+.32,.68,g);
  const hd=new T.Group();hd.position.set(0,o.lying?.98:by+.66,.98);hd.scale.setScalar(o.hs||1);g.add(hd);
  mesh(Sp(.3,18,14),c,0,0,0,hd).scale.set(1,.95,1.1);
  mesh(Sp(.17,14,10),lt,0,-.08,.3,hd).scale.set(.9,.7,1.3);mesh(Sp(.06,10,8),k,0,-.01,.5,hd);
  [-1,1].forEach(s=>{mesh(Sp(.04,8,6),k,s*.12,.08,.25,hd);const e=mesh(Sp(.14,10,8),ec,s*.25,.05,-.02,hd);e.scale.set(.35,1,.6);e.rotation.z=s*.35});
  const legs=[];[[-.2,.5],[.2,.5],[-.2,-.5],[.2,-.5]].forEach(([x,z],i)=>{const pv=new T.Group(),len=o.lying?.55:by-.05;pv.position.set(x,o.lying?.4:by-.05,z);g.add(pv);
    mesh(new T.CylinderGeometry(.07,.055,len,8),c,0,-len/2,0,pv).castShadow=true;mesh(Sp(.09,8,6),lt,0,-len,.03,pv).scale.z=1.3;
    if(o.lying)pv.rotation.x=i<2?-1.45:-1.0;legs.push(pv)});
  const tail=new T.Group();tail.position.set(0,by+.15,-.75);tail.rotation.x=-.9;g.add(tail);mesh(new T.CylinderGeometry(.03,.07,.65,8),c,0,.32,0,tail);
  g.scale.setScalar(o.s);g.userData={legs,tail,hd,body,by};return g}
function tiny(col,x,z,ry){const g=new T.Group();g.position.set(x,.2,z);g.rotation.y=ry;
  const m=M(col);mesh(Sp(.2,12,8),m,0,0,0,g).scale.set(.9,.8,1.5);mesh(Sp(.14,12,8),m,0,.04,.32,g);
  [-1,1].forEach(s=>{const e=mesh(Sp(.06,6,4),M(0x7a5030),s*.1,.1,.3,g);e.scale.set(.5,1,.7)});mesh(Sp(.025,6,4),M(0x222222),0,.04,.46,g);return g}

/* stages */
const stage=[];
function mk(a,r=1.9){cur=[];const g=new T.Group();g.position.copy(P(a));scene.add(g);stage.push({g,mats:cur,k:1,sc:1,a});
  mesh(new T.CylinderGeometry(r,r+.2,.22,48),M(0xffd070),0,.11,0,g).receiveShadow=true;
  const t=mesh(new T.CylinderGeometry(r-.12,r-.12,.06,48),M(0x5fd568),0,.24,0,g);t.receiveShadow=true;
  for(let i=0;i<5;i++){const q=i*1.25+.3;flower(g,Math.cos(q)*(r-.35),Math.sin(q)*(r-.35),.8,FC[i%4])}return g}
const g0=mk(A[0]),adult=dog({c:0xe8993f,s:1.1,legH:.9});adult.position.y=.25;g0.add(adult);
const g1=mk(A[1],2.1),mom=dog({c:0xe8993f,s:1,legH:.9});mom.position.set(-.8,.25,0);mom.rotation.y=.5;g1.add(mom);
const bub=new T.Group();bub.position.set(1.5,2.5,.2);g1.add(bub);
mesh(Sp(1.15,32,24),M(0xf7d9d0,{transparent:true,opacity:.32,roughness:.1,side:T.DoubleSide}),0,0,0,bub);
const halo=mesh(new T.TorusGeometry(1.3,.04,10,60),M(0xD9C5A3,{emissive:0x8a7340,emissive:0x6a5a30}),0,0,0,bub);
const hl=new T.Sprite(new T.SpriteMaterial({map:cvs(128,128,x=>{const g=x.createRadialGradient(64,64,10,64,64,64);g.addColorStop(0,'rgba(255,214,200,.55)');g.addColorStop(1,'rgba(255,214,200,0)');x.fillStyle=g;x.fillRect(0,0,128,128)}),transparent:true,depthWrite:false}));hl.scale.set(4.2,4.2,1);bub.add(hl);
const fet=new T.Group();bub.add(fet);const fm=M(0xefb7a3,{roughness:.6});
mesh(Sp(.36,16,12),fm,0,0,0,fet).scale.set(1,.85,1.25);mesh(Sp(.24,14,10),fm,0,.22,.38,fet);
[-1,1].forEach(s=>{mesh(Sp(.07,6,4),M(0x6a4a40),s*.12,.3,.5,fet);const e=mesh(Sp(.08,8,6),fm,s*.2,.38,.3,fet);e.scale.set(.5,1,.7);
  [.2,-.2].forEach(z=>{const l=mesh(new T.CylinderGeometry(.06,.045,.4,8),fm,s*.24,-.22,z,fet);l.rotation.x=z>0?.7:-.6})});
mesh(new T.CylinderGeometry(.04,.07,.4,8),fm,0,.0,-.5,fet).rotation.x=1.9;
const cord=new T.CatmullRomCurve3([new T.Vector3(0,-.25,-.1),new T.Vector3(.4,-.7,-.2),new T.Vector3(.5,-.95,-.5),new T.Vector3(.7,-.85,-.7)]);
mesh(new T.TubeGeometry(cord,20,.035,6),M(0xe8a8a0),0,0,0,fet);mesh(Sp(.2,10,8),M(0xd98a88),.72,-.85,-.72,fet).scale.y=.4;
const g2=mk(A[2],2.4),mm=dog({c:0xe8993f,s:1,legH:.9,lying:true});mm.position.set(0,.25,-.2);mm.rotation.y=-.3;g2.add(mm);
const pups=[tiny(0xffc45e,-.8,.1,.15),tiny(0xd9803a,.85,0,-.1),tiny(0xffe2a8,-.75,-.5,.1),tiny(0xe8993f,.8,-.55,-.1)];pups.forEach(p=>{p.position.y+=.25;mm.add(p);p.scale.setScalar(1.15)});
const g3=mk(A[3]),pup=dog({c:0xffc45e,l:0xfff4d6,e:0xc9702e,s:.6,legH:.7,hs:1.35});pup.position.y=.25;g3.add(pup);
mm.userData.hd.rotation.x=.55;
cur=null;
/* arrows */
const am=new T.MeshStandardMaterial({color:0xff4f7b,roughness:.5}),dots=[];
for(let i=0;i<4;i++){const a0=A[i]+.42,a1=(i==3?A[0]+6.283:A[i+1])-.42,pts=[];
  for(let k=0;k<=24;k++){const v=P(a0+(a1-a0)*k/24);v.y=.3;pts.push(v)}
  mesh(new T.TubeGeometry(new T.CatmullRomCurve3(pts),40,.06,8),am);
  const c=mesh(new T.ConeGeometry(.26,.55,14),am);c.position.copy(P(a1));c.position.y=.3;
  c.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),new T.Vector3(Math.cos(a1),0,Math.sin(a1)));
  for(let k=0;k<3;k++)dots.push({m:mesh(Sp(.13,10,8),new T.MeshBasicMaterial({color:0xffe14d})),a0,a1,k})}
scene.traverse(o=>{if(o.isMesh&&o.material.type==='MeshStandardMaterial'&&o.geometry.type!=='CircleGeometry'&&o.geometry.type!=='RingGeometry')o.castShadow=o.material.opacity>.5});

/* UI */
const S=[
 {n:'Chó trưởng thành',t:'Chó trưởng thành có khả năng sinh sản.',y:3.1,d:8},
 {n:'Thai',c:'Hợp tử phát triển thành phôi, phôi phát triển thành thai trong cơ thể mẹ.',t:'Hợp tử phát triển thành phôi, phôi phát triển thành thai trong cơ thể mẹ. Chó con phát triển trong cơ thể chó mẹ.',y:4.1,d:9},
 {n:'Chó con mới được sinh ra',c:'Chó con được chó mẹ nuôi bằng sữa.',t:'Chó mẹ sinh con và nuôi con bằng sữa. Chó con được chó mẹ nuôi bằng sữa.',y:2.1,d:8},
 {n:'Chó con',t:'Chó con lớn lên, phát triển thành chó trưởng thành.',y:2.2,d:6.5}];
const info=document.getElementById('info'),bar=document.getElementById('stg'),lbs=document.getElementById('lbs');
const key='Chó là động vật đẻ con. Chó con được sinh ra từ cơ thể mẹ và được nuôi bằng sữa mẹ.';
S.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.n;b.onclick=()=>{stopTour();focus(i)};bar.appendChild(b);s.b=b;
  const l=document.createElement('div');l.className='lb';l.innerHTML='<span>'+s.n+'</span>'+(s.c?'<small>'+s.c+'</small>':'');lbs.appendChild(l);s.l=l;s.p=P(A[i]).add(new T.Vector3(0,s.y,0))});
let foc=-1,tourT=null;
const tb=document.createElement('button');tb.textContent='Khám phá vòng đời';bar.appendChild(tb);
function focus(i){foc=i;S.forEach((s,k)=>s.b.classList.toggle('on',k==i));info.innerHTML='<b>'+S[i].n+'</b>'+S[i].t+'<em>'+key+'</em>';info.style.display='block'}
function home(){foc=-1;S.forEach(s=>s.b.classList.remove('on'));info.style.display='none'}
function stopTour(){clearInterval(tourT);tourT=null;tb.classList.remove('on')}
tb.onclick=()=>{if(tourT){stopTour();return}tb.classList.add('on');let i=0;focus(0);tourT=setInterval(()=>{i++;if(i>3){stopTour();home();return}focus(i)},7000)};
document.getElementById('home').onclick=()=>{stopTour();home()};
/* camera */
let th=.4,ph=.55,dist=29,tdist=29,tgt=new T.Vector3(0,1.2,0),ttgt=new T.Vector3(0,1.2,0);
const cv=renderer.domElement,ptr=new Map();let pd=0;
cv.onpointerdown=e=>{ptr.set(e.pointerId,[e.clientX,e.clientY]);cv.setPointerCapture(e.pointerId);pd=0};
cv.onpointerup=cv.onpointercancel=e=>ptr.delete(e.pointerId);
cv.onpointermove=e=>{const o=ptr.get(e.pointerId);if(!o)return;
  if(ptr.size==2){const q=[...ptr.entries()].find(k=>k[0]!=e.pointerId)[1],d=Math.hypot(e.clientX-q[0],e.clientY-q[1]);if(pd)tdist=Math.min(48,Math.max(4,tdist*pd/d));pd=d}
  else{th-=(e.clientX-o[0])*.006;ph=Math.min(1.35,Math.max(.08,ph+(e.clientY-o[1])*.005));if(foc>=0)foc=-2}
  ptr.set(e.pointerId,[e.clientX,e.clientY])};
cv.addEventListener('wheel',e=>{e.preventDefault();tdist=Math.min(48,Math.max(4,tdist+e.deltaY*.02))},{passive:false});
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const clock=new T.Clock(),v=new T.Vector3();
function walk(d,t,sp,amp,ph){d.userData.legs.forEach((l,i)=>l.rotation.x=Math.sin(t*sp+(i==1||i==2?Math.PI:0))*amp)}
function loop(){const t=clock.getElapsedTime();
  if(foc>=0){const s=S[foc],a=A[foc];ttgt.copy(P(a));ttgt.y=s.y*.45;tdist=s.d+(innerWidth<innerHeight?5:0);let d=a+Math.PI-th;d=Math.atan2(Math.sin(d),Math.cos(d));if(!ptr.size)th+=d*.05;ph+=(.4-ph)*.03}
  else if(foc==-1){ttgt.set(0,1.2,0);if(!ptr.size)th+=.0012;if(tdist<20)tdist=29}
  tgt.lerp(ttgt,.06);dist+=(tdist-dist)*.07;
  camera.position.set(tgt.x+dist*Math.sin(th)*Math.cos(ph),tgt.y+dist*Math.sin(ph),tgt.z+dist*Math.cos(th)*Math.cos(ph));camera.lookAt(tgt);
  stage.forEach((s,i)=>{const k=foc<0?1:(i==foc?1.08:.5);s.k+=(k-s.k)*.07;s.sc+=((foc==i?1.4:1)-s.sc)*.07;s.g.scale.setScalar(s.sc);
    const e=Math.max(0,s.k-1)*1.2;s.mats.forEach(o=>{o.m.color.copy(o.b).multiplyScalar(Math.min(s.k,1)+Math.max(0,s.k-1));if(o.m.emissive&&o.m.emissive.getHex()===0||o.m.userData.e===undefined&&o.m.emissive)o.m.emissive.copy(o.b).multiplyScalar(e*.35)})});
  /* adult walks in circle */
  let w=t*.3;adult.position.set(Math.cos(w)*.8,.25,Math.sin(w)*.8);adult.rotation.y=Math.atan2(-Math.sin(w),Math.cos(w));
  walk(adult,t,3.5,.3);adult.userData.tail.rotation.y=Math.sin(t*5)*.5;adult.userData.hd.rotation.x=Math.sin(t*.9)*.06;
  /* pregnant mother */
  mom.userData.tail.rotation.y=Math.sin(t*4)*.4;mom.userData.body.scale.y=.38*(1+Math.sin(t*1.8)*.03);mom.userData.hd.rotation.y=Math.sin(t*.6)*.3;
  walk(mom,t,0,0);
  bub.position.y=2.5+Math.sin(t*1.2)*.1;fet.rotation.y=t*.5;fet.scale.setScalar(1+Math.sin(t*5)*.03);halo.rotation.set(t*.4,t*.3,0);
  /* newborn nursing */
  mm.userData.body.scale.y=.38*(1+Math.sin(t*2)*.035);mm.userData.hd.rotation.y=Math.sin(t*.7)*.35;mm.userData.hd.rotation.x=.55+Math.sin(t*1.4)*.06;mm.userData.tail.rotation.y=Math.sin(t*2)*.2;
  pups.forEach((p,i)=>{p.rotation.z=Math.sin(t*3+i*1.7)*.08;p.scale.y=1.15*(1+Math.sin(t*5+i)*.05);p.position.z+=Math.sin(t*2+i)*.0007});
  /* playful pup */
  w=-t*.7;pup.position.set(Math.cos(w)*1,.25+Math.abs(Math.sin(t*5))*.1,Math.sin(w)*1);pup.rotation.y=Math.atan2(Math.sin(w),-Math.cos(w));
  walk(pup,t,10,.6);pup.userData.tail.rotation.y=Math.sin(t*14)*.7;pup.userData.hd.rotation.z=Math.sin(t*3)*.12;
  dots.forEach(d=>{const f=((t*.22+d.k/3)%1);const p=P(d.a0+(d.a1-d.a0)*f);d.m.position.set(p.x,.38,p.z);d.m.scale.setScalar(Math.sin(f*Math.PI)+.2)});
  clouds.forEach(c=>{c.position.x+=.01;if(c.position.x>65)c.position.x=-65});
  renderer.render(scene,camera);
  S.forEach((s,i)=>{v.copy(s.p).project(camera);const sc=stage[i].sc;
    s.l.style.transform='translate('+((v.x*.5+.5)*innerWidth)+'px,'+((-v.y*.5+.5)*innerHeight)+'px) translate(-50%,-100%)';
    s.l.style.opacity=v.z>1?0:(foc<0||foc==i?1:.35)});
  requestAnimationFrame(loop)}
loop();
