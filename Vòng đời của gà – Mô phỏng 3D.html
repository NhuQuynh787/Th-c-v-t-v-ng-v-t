<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vòng đời của gà – Mô phỏng 3D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap">
<style>
:root{--pill:#fffaf0;--ink:#4a2c12;--accent:#e2572b;--panel:rgba(255,250,240,.94);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pill:#3b2616;--ink:#fff1dc;--panel:rgba(59,38,22,.94)}}
:root[data-theme="dark"]{--pill:#3b2616;--ink:#fff1dc;--panel:rgba(59,38,22,.94)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#bfe6f5;font-family:'Baloo 2','Segoe UI',system-ui,sans-serif}
canvas{display:block;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
#labels{position:fixed;inset:0;pointer-events:none}
.lb{position:absolute;left:0;top:0;pointer-events:auto;border:2px solid var(--ink);background:var(--pill);color:var(--ink);font:700 15px/1.2 'Baloo 2','Segoe UI',sans-serif;padding:5px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;box-shadow:0 3px 0 var(--ink)}
.lb small{display:block;font-weight:500;font-size:12px;opacity:.8}
.lb.on{background:var(--accent);color:#fff;border-color:#7a2a10}
h1{position:fixed;left:16px;top:calc(10px + env(safe-area-inset-top,0px));margin:0;font:700 clamp(22px,4vw,38px)/1 'Baloo 2',sans-serif;color:#fff;text-shadow:0 3px 0 #b5471f,0 6px 14px rgba(0,0,0,.25)}
#info{position:fixed;left:50%;bottom:54px;transform:translateX(-50%);width:min(92vw,520px);background:var(--panel);color:var(--ink);border-radius:18px;padding:10px 16px;font-size:15px;line-height:1.35;box-shadow:0 6px 18px rgba(0,0,0,.22);text-align:center}
#info b{color:var(--accent)}
#all{position:fixed;right:14px;top:calc(12px + env(safe-area-inset-top,0px));border:2px solid var(--ink);background:var(--pill);color:var(--ink);font:700 14px 'Baloo 2',sans-serif;padding:6px 14px;border-radius:999px;cursor:pointer}
footer{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));text-align:center;font:700 17px 'Baloo 2',sans-serif;color:#fff;text-shadow:0 2px 0 #7a2a10,0 3px 10px rgba(0,0,0,.35);letter-spacing:.5px}
</style>
</head>
<body>
<h1>Vòng đời của gà</h1>
<button id="all">Xem toàn cảnh</button>
<div id="labels"></div>
<div id="info"><b>Kéo chuột</b> để xoay, <b>cuộn</b> để thu phóng, bấm vào tên từng giai đoạn để xem chi tiết.</div>
<footer>Made by Như Quỳnh</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE, R=6;
const scene=new T.Scene();
scene.background=new T.Color(0xbfe6f5);
scene.fog=new T.Fog(0xcdeaf3,35,80);
const camera=new T.PerspectiveCamera(50,1,.1,200);
const renderer=new T.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
document.body.prepend(renderer.domElement);

scene.add(new T.HemisphereLight(0xffffff,0x6a9a4a,.75));
const sun=new T.DirectionalLight(0xfff1c8,.9);
sun.position.set(12,20,10);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-16,right:16,top:16,bottom:-16,near:1,far:60});
scene.add(sun);

const M=(c,o={})=>new T.MeshStandardMaterial(Object.assign({color:c,roughness:.85},o));
const mesh=(g,m,x=0,y=0,z=0)=>{const o=new T.Mesh(g,m);o.position.set(x,y,z);return o};
const P=a=>new T.Vector3(R*Math.sin(a),0,-R*Math.cos(a));

/* ground */
const ground=mesh(new T.CircleGeometry(60,64),M(0x78b84f));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const inner=mesh(new T.CircleGeometry(10.5,64),M(0x93cc63),0,.01,0);inner.rotation.x=-Math.PI/2;inner.receiveShadow=true;scene.add(inner);
const path=mesh(new T.RingGeometry(R-.9,R+.9,64),M(0xe3c98f),0,.02,0);path.rotation.x=-Math.PI/2;path.receiveShadow=true;scene.add(path);

/* flowers & grass */
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const fc=[0xff7aa8,0xffd23f,0xffffff,0xc79bff];
for(let i=0;i<150;i++){
  const a=rnd()*6.283,r=10.8+rnd()*22;
  const g=new T.Group();g.position.set(Math.cos(a)*r,0,Math.sin(a)*r);
  g.add(mesh(new T.CylinderGeometry(.02,.02,.4),M(0x3f8a2e),0,.2,0));
  g.add(mesh(new T.SphereGeometry(.13,8,6),M(fc[i%4]),0,.42,0));
  scene.add(g);
}
/* trees */
function tree(x,z,s){
  const g=new T.Group();g.position.set(x,0,z);g.scale.setScalar(s);
  g.add(mesh(new T.CylinderGeometry(.3,.4,2.2),M(0x7a4a26),0,1.1,0));
  [[0,3,1.7],[.3,4.1,1.3],[-.3,4.9,.9]].forEach(([dx,y,r])=>g.add(mesh(new T.SphereGeometry(r,14,10),M(0x3f9b3f),dx,y,0)));
  scene.add(g);
}
[[-16,-10,1.3],[15,-13,1.5],[-20,2,1.1],[19,-2,1.2],[-12,-18,1.6],[6,-20,1.2],[-22,-8,1.4]].forEach(a=>tree(...a));
/* barn */
(function(){
  const g=new T.Group();g.position.set(-9,0,-16);g.rotation.y=.35;
  g.add(mesh(new T.BoxGeometry(6,3.6,4.5),M(0xc8412b),0,1.8,0));
  const roof=mesh(new T.CylinderGeometry(3.4,3.4,5,3),M(0x7d3a22),0,4.2,0);
  roof.rotation.set(Math.PI/2,0,Math.PI/2);roof.scale.set(.55,1,1);g.add(roof);
  g.add(mesh(new T.BoxGeometry(1.6,2.4,.1),M(0xfff0d6),0,1.2,2.28));
  g.add(mesh(new T.BoxGeometry(.18,2.4,.12),M(0xc8412b),0,1.2,2.33));
  scene.add(g);
})();
/* fence */
for(let i=0;i<34;i++){
  const a=-Math.PI*1.05+i*(Math.PI*1.1/33),r=13.5;
  const f=new T.Group();f.position.set(Math.sin(a)*r,0,-Math.cos(a)*r*1.0);f.rotation.y=-a;
  f.add(mesh(new T.BoxGeometry(.2,1.3,.2),M(0xf3e2c0),0,.65,0));
  f.add(mesh(new T.BoxGeometry(1.1,.14,.1),M(0xf3e2c0),.5,.95,0));
  f.add(mesh(new T.BoxGeometry(1.1,.14,.1),M(0xf3e2c0),.5,.5,0));
  scene.add(f);
}
/* sun & clouds */
const sunBall=mesh(new T.SphereGeometry(3,24,16),new T.MeshBasicMaterial({color:0xffe27a}),-30,28,-45);scene.add(sunBall);
const clouds=[];
for(let i=0;i<7;i++){
  const c=new T.Group();
  for(let j=0;j<5;j++)c.add(mesh(new T.SphereGeometry(1.4+rnd()*1.2,12,8),new T.MeshBasicMaterial({color:0xffffff}),j*1.6,rnd()*.6,rnd()));
  c.position.set(-40+i*14,18+rnd()*8,-30-rnd()*15);scene.add(c);clouds.push(c);
}

/* characters */
function chicken(o){
  const g=new T.Group(),bm=M(o.body),hm=M(o.head||o.body);
  const body=mesh(new T.SphereGeometry(.6,24,16),bm,0,1,0);body.scale.set(1,o.by||.85,o.bz||1.2);g.add(body);
  const head=new T.Group();head.position.set(0,o.hy,o.hz);g.add(head);
  head.add(mesh(new T.SphereGeometry(o.hr,20,14),hm));
  const beak=mesh(new T.ConeGeometry(o.hr*.3,o.hr*.8,10),M(0xf2a31b),0,-o.hr*.1,o.hr*1.05);beak.rotation.x=Math.PI/2;head.add(beak);
  [-1,1].forEach(s=>{
    head.add(mesh(new T.SphereGeometry(o.hr*.14,8,6),M(0x111111),s*o.hr*.55,o.hr*.2,o.hr*.7));
    const w=mesh(new T.SphereGeometry(.3,14,10),bm,s*.55,1.05,-.05);w.scale.set(.25,.7,1);w.rotation.z=s*.15;g.add(w);
    const leg=new T.Group();leg.position.set(s*.25,.45,.05);
    leg.add(mesh(new T.CylinderGeometry(.04,.04,.5),M(0xf0a020),0,0,0));
    leg.add(mesh(new T.BoxGeometry(.2,.04,.3),M(0xf0a020),0,-.25,.08));
    g.add(leg);
  });
  if(o.comb){
    for(let i=0;i<3;i++)head.add(mesh(new T.SphereGeometry(o.hr*.28,10,8),M(0xd62828),0,o.hr*(.95+(i==1?.15:0)),(i-1)*o.hr*.35));
    head.add(mesh(new T.SphereGeometry(o.hr*.2,10,8),M(0xd62828),0,-o.hr*.7,o.hr*.8));
  }
  for(let i=-1;i<=1;i++){const t=mesh(new T.ConeGeometry(.2,.9,8),M(o.tail||o.body),i*.2,1.3,-.8);t.rotation.set(-2.2,0,i*.35);g.add(t)}
  g.userData.head=head;g.scale.setScalar(o.s);
  return g;
}
const hen=chicken({body:0xa8531f,tail:0x6e2f12,hy:1.8,hz:.65,hr:.3,comb:true,s:1.5});
hen.position.copy(P(0));hen.rotation.y=Math.PI*.15;scene.add(hen);

const nest=new T.Group();nest.position.copy(P(Math.PI/2));
const ring=mesh(new T.TorusGeometry(1.1,.3,12,28),M(0xb8893a),0,.3,0);ring.rotation.x=Math.PI/2;ring.scale.set(1,1,1.4);nest.add(ring);
nest.add(mesh(new T.CylinderGeometry(1.1,1.0,.3,24),M(0xd9b45f),0,.2,0));
const eggs=[];
[[-.4,0],[.35,.2],[0,-.4]].forEach(([x,z])=>{const e=mesh(new T.SphereGeometry(.34,18,14),M(0xf3c18a,{roughness:.5}),x,.65,z);e.scale.y=1.3;nest.add(e);eggs.push(e)});
const big=new T.Group();big.position.set(0,3.3,0);
const shell=mesh(new T.SphereGeometry(1,24,18),M(0xffe9c8,{transparent:true,opacity:.45,roughness:.2}));shell.scale.y=1.3;big.add(shell);
big.add(mesh(new T.SphereGeometry(.55,16,12),M(0xffc21a),0,-.15,0));
const emb=mesh(new T.SphereGeometry(.4,16,12),M(0xf6a08f),.1,.2,.1);big.add(emb);
big.add(mesh(new T.SphereGeometry(.06,8,6),M(0x111111),.3,.3,.4));
nest.add(big);scene.add(nest);

const hatch=new T.Group();hatch.position.copy(P(Math.PI));
const sh=M(0xfff1d8,{side:T.DoubleSide,roughness:.5});
hatch.add(mesh(new T.SphereGeometry(.7,24,14,0,6.283,Math.PI*.5,Math.PI*.5),sh,0,.55,0));
const caps=[];
[-1,1].forEach(s=>{const c=mesh(new T.SphereGeometry(.7,16,10,0,3.2,0,Math.PI*.38),sh,s*.75,1.15,0);c.rotation.z=-s*.9;c.rotation.y=s>0?0:3.14;hatch.add(c);caps.push(c)});
const chick1=chicken({body:0xffd21f,hy:1.45,hz:.4,hr:.4,by:1,bz:1.05,s:.75});chick1.position.y=.45;hatch.add(chick1);
scene.add(hatch);

const chick2=chicken({body:0xb97a45,head:0xc98e55,tail:0x6e3f1c,hy:1.55,hz:.5,hr:.34,by:.95,bz:1.2,s:1});
chick2.position.copy(P(Math.PI*1.5));chick2.rotation.y=Math.PI*.7;scene.add(chick2);

/* arrows */
const arrowM=M(0x6b7b8c);
for(let i=0;i<4;i++){
  const a0=i*Math.PI/2+.5,a1=(i+1)*Math.PI/2-.5,pts=[];
  for(let k=0;k<=16;k++){const v=P(a0+(a1-a0)*k/16);v.y=.35;pts.push(v)}
  scene.add(mesh(new T.TubeGeometry(new T.CatmullRomCurve3(pts),32,.07,8),arrowM));
  const cone=mesh(new T.ConeGeometry(.28,.6,12),arrowM);
  cone.position.copy(P(a1));cone.position.y=.35;
  cone.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),new T.Vector3(Math.cos(a1),0,Math.sin(a1)));
  scene.add(cone);
}
const token=mesh(new T.SphereGeometry(.22,16,12),new T.MeshBasicMaterial({color:0xffd23f}),0,.6,0);scene.add(token);
scene.traverse(o=>{if(o.isMesh&&o.geometry.type!=='CircleGeometry'&&o.material.type!=='MeshBasicMaterial'){o.castShadow=true}});

/* stages & labels */
const stages=[
 {n:'Gà trưởng thành',a:0,y:3.9,t:'Gà mái trưởng thành đẻ trứng rồi ấp trứng trong tổ để bắt đầu một vòng đời mới.'},
 {n:'Trứng',s:'đã được thụ tinh',a:Math.PI/2,y:5.4,t:'Sau khoảng 21 ngày ấp, phôi gà phát triển dần bên trong quả trứng đã được thụ tinh.'},
 {n:'Gà con mới nở',a:Math.PI,y:2.5,t:'Gà con mổ vỡ vỏ trứng, chui ra với bộ lông tơ vàng mềm mại.'},
 {n:'Gà con',a:Math.PI*1.5,y:2.7,t:'Gà con ăn uống và lớn nhanh, lông vũ mọc dần cho đến khi trở thành gà trưởng thành.'}
];
const lbEl=document.getElementById('labels'),info=document.getElementById('info');
stages.forEach((s,i)=>{
  const b=document.createElement('button');b.className='lb';
  b.innerHTML=s.n+(s.s?'<small>'+s.s+'</small>':'');
  b.onclick=()=>focus(i);lbEl.appendChild(b);s.el=b;
  s.p=P(s.a).add(new T.Vector3(0,s.y,0));
});
const dflt=info.innerHTML;let focused=-1;
function focus(i){
  focused=i;stages.forEach((s,k)=>s.el.classList.toggle('on',k===i));
  info.innerHTML='<b>'+stages[i].n+(stages[i].s?' '+stages[i].s:'')+':</b> '+stages[i].t;
}
document.getElementById('all').onclick=()=>{focused=-1;stages.forEach(s=>s.el.classList.remove('on'));info.innerHTML=dflt};

/* camera control */
let th=.2,ph=.62,dist=26,tth=th,tdist=dist,drag=false,lx=0,ly=0,idle=0;
const cv=renderer.domElement;
cv.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointerup',()=>drag=false);
cv.addEventListener('pointermove',e=>{if(!drag)return;th-=(e.clientX-lx)*.006;tth=th;ph=Math.min(1.3,Math.max(.15,ph+(e.clientY-ly)*.005));lx=e.clientX;ly=e.clientY;idle=0});
cv.addEventListener('wheel',e=>{e.preventDefault();tdist=Math.min(40,Math.max(10,tdist+e.deltaY*.02))},{passive:false});
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();tdist=Math.max(tdist,w<h?32:tdist)}
addEventListener('resize',resize);resize();

const clock=new T.Clock(),tmp=new T.Vector3();
function loop(){
  const t=clock.getElapsedTime();
  if(!drag){
    if(focused>=0){let d=stages[focused].a+Math.PI-th;d=Math.atan2(Math.sin(d),Math.cos(d));th+=d*.05}
    else th+=.0016;
  }
  dist+=(tdist-dist)*.08;
  camera.position.set(dist*Math.sin(th)*Math.cos(ph),dist*Math.sin(ph),dist*Math.cos(th)*Math.cos(ph));
  camera.lookAt(0,1.5,0);
  /* animation */
  hen.userData.head.rotation.x=Math.max(0,Math.sin(t*3))*.7;hen.position.y=Math.abs(Math.sin(t*1.5))*.03;
  chick2.userData.head.rotation.x=Math.max(0,Math.sin(t*4+1))*.8;chick2.position.y=Math.abs(Math.sin(t*5))*.12;
  chick1.rotation.y=Math.sin(t*1.2)*.5;chick1.position.y=.45+Math.sin(t*3)*.04;
  const open=(Math.sin(t*1.2)+1)/2;
  caps[0].position.y=1.15+open*.15;caps[1].position.y=1.15+open*.15;
  eggs.forEach((e,i)=>{const s=1+Math.sin(t*2+i)*.04;e.scale.set(s,1.3*s,s)});
  big.rotation.y=t*.8;big.position.y=3.3+Math.sin(t*1.5)*.15;emb.scale.setScalar(1+Math.sin(t*3)*.05);
  const a=t*.35;token.position.copy(P(a));token.position.y=.6+Math.sin(t*6)*.08;
  clouds.forEach((c,i)=>{c.position.x+=.01+i*.002;if(c.position.x>50)c.position.x=-50});
  renderer.render(scene,camera);
  /* labels */
  stages.forEach(s=>{
    tmp.copy(s.p).project(camera);
    s.el.style.transform='translate('+((tmp.x*.5+.5)*innerWidth)+'px,'+((-tmp.y*.5+.5)*innerHeight)+'px) translate(-50%,-100%)';
    s.el.style.display=tmp.z>1?'none':'block';
  });
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
