<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vòng đời của bướm – AI-PRIMARY SCIENCE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap">
<style>
:root{--pill:#fffaf2;--ink:#2f4a3a;--accent:#8e5bd8;--panel:rgba(255,252,246,.95);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pill:#2b3d33;--ink:#eaf7ec;--panel:rgba(35,52,43,.95)}}
:root[data-theme="dark"]{--pill:#2b3d33;--ink:#eaf7ec;--panel:rgba(35,52,43,.95)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#cfeef5;font-family:'Baloo 2','Segoe UI',system-ui,sans-serif}
canvas{display:block;touch-action:none;cursor:grab}
.hd{position:fixed;left:16px;top:calc(10px + env(safe-area-inset-top,0px));pointer-events:none}
h1{margin:0;font:700 clamp(22px,4.2vw,40px)/1 'Baloo 2',sans-serif;color:#fff;text-shadow:0 3px 0 #6b3fb0,0 6px 14px rgba(0,0,0,.25)}
.hd p{margin:4px 0 0;font-size:clamp(12px,1.8vw,16px);color:#fff;font-style:italic;text-shadow:0 2px 6px rgba(0,0,0,.45)}
.tools{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:60vw}
button{font:700 14px 'Baloo 2','Segoe UI',sans-serif;border:2px solid var(--ink);background:var(--pill);color:var(--ink);padding:6px 14px;border-radius:999px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.on{background:var(--accent);color:#fff;border-color:#4a2a85;box-shadow:0 3px 0 #4a2a85}
.stg{position:fixed;left:0;right:0;bottom:calc(40px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 8px}
.stg button{font-size:16px;padding:8px 16px}
#info{position:fixed;left:50%;bottom:calc(118px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(94vw,560px);background:var(--panel);color:var(--ink);border-radius:20px;padding:10px 18px;font-size:15px;line-height:1.4;box-shadow:0 8px 22px rgba(0,0,0,.25)}
#info b{display:block;font-size:19px;color:var(--accent)}
@media(max-width:560px){.stg{bottom:calc(36px + env(safe-area-inset-bottom,0px))}.stg button{font-size:13px;padding:6px 10px}#info{bottom:calc(112px + env(safe-area-inset-bottom,0px));font-size:13px}.tools{max-width:46vw}}
.ft{position:fixed;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;padding:0 16px;font:700 15px 'Baloo 2',sans-serif;color:#fff;text-shadow:0 2px 0 #3d6b3a,0 3px 8px rgba(0,0,0,.4);pointer-events:none}
</style>
</head>
<body>
<div class="hd"><h1>VÒNG ĐỜI CỦA BƯỚM</h1><p>Khám phá hành trình biến đổi kỳ diệu của thế giới tự nhiên</p></div>
<div class="tools"><button id="tour">Khám phá toàn bộ vòng đời</button><button id="home">Trở về toàn cảnh</button><button id="snd">Âm thanh: Tắt</button></div>
<div id="info"><b>Chào mừng bạn đến khu vườn!</b>Kéo để xoay, cuộn hoặc chụm hai ngón để thu phóng. Bấm vào từng giai đoạn để khám phá.</div>
<div class="stg" id="stg"></div>
<div class="ft"><span>Made by Như Quỳnh</span><span>AI-PRIMARY SCIENCE</span></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE,R=6;
const scene=new T.Scene(),camera=new T.PerspectiveCamera(50,1,.1,300);
const renderer=new T.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;
document.body.prepend(renderer.domElement);
const cvs=(w,h,f)=>{const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);return new T.CanvasTexture(c)};
scene.background=cvs(8,256,(x,w,h)=>{const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#7fcdea');g.addColorStop(.6,'#c9efee');g.addColorStop(1,'#fff3c9');x.fillStyle=g;x.fillRect(0,0,w,h)});
scene.fog=new T.Fog(0xd5f0ee,40,100);
scene.add(new T.HemisphereLight(0xffffff,0x7fbf5a,.8));
const sun=new T.DirectionalLight(0xffefc0,.9);sun.position.set(10,22,8);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-16,right:16,top:16,bottom:-16,near:1,far:60});scene.add(sun);
let cur=null;
const M=(c,o={})=>{const m=new T.MeshStandardMaterial(Object.assign({color:c,roughness:.8},o));if(cur)cur.push({m,b:new T.Color(c)});return m};
const mesh=(g,m,x=0,y=0,z=0,p)=>{const o=new T.Mesh(g,m);o.position.set(x,y,z);(p||scene).add(o);return o};
const Sp=(r,w=14,h=10)=>new T.SphereGeometry(r,w,h);
const P=a=>new T.Vector3(R*Math.sin(a),0,-R*Math.cos(a));
let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;

/* ground */
const gr=mesh(new T.CircleGeometry(80,64),new T.MeshStandardMaterial({color:0x6fb64e}));gr.rotation.x=-Math.PI/2;gr.receiveShadow=true;
const inn=mesh(new T.CircleGeometry(11,64),new T.MeshStandardMaterial({color:0x8fd067}),0,.01,0);inn.rotation.x=-Math.PI/2;inn.receiveShadow=true;
const pth=mesh(new T.RingGeometry(R-.9,R+.9,64),new T.MeshStandardMaterial({color:0xf1dfa6}),0,.02,0);pth.rotation.x=-Math.PI/2;pth.receiveShadow=true;

/* helpers */
function leaf(p,x,y,z,s,ry=0,rz=0,c=0x58bc4c){const g=new T.Group();g.position.set(x,y,z);g.rotation.set(0,ry,rz);p.add(g);
  const l=mesh(Sp(1,16,8),M(c),0,0,0,g);l.scale.set(s,.06*s,.55*s);l.castShadow=true;
  mesh(new T.BoxGeometry(2*s,.02,.04),M(0xa6e08a),0,.05*s,0,g);return g}
const PC=[0xff8fb8,0xc79bff,0xffd84a,0xff9aa2,0xffffff];
function flower(p,x,z,h,c,s=1){const g=new T.Group();g.position.set(x,0,z);g.scale.setScalar(s);p.add(g);
  mesh(new T.CylinderGeometry(.03,.04,h,6),M(0x3f9a3a),0,h/2,0,g);leaf(g,.15,h*.4,0,.22,0,.4);
  const hd=new T.Group();hd.position.y=h;hd.rotation.x=-.3;g.add(hd);
  for(let i=0;i<8;i++){const a=i*Math.PI/4,pt=mesh(Sp(.2,8,6),M(c),Math.cos(a)*.22,0,Math.sin(a)*.22,hd);pt.scale.set(1,.3,.6);pt.rotation.y=-a}
  mesh(Sp(.13,10,8),M(0xffc21a),0,.03,0,hd);return g}
const sw=[];
const stage=[];
function mk(a,y){cur=[];const g=new T.Group();g.position.copy(P(a));scene.add(g);const s={g,mats:cur,k:1,sc:1};stage.push(s);
  const mo=mesh(new T.CylinderGeometry(1.7,2,.2,28),M(0x7bc85a),0,.1,0,g);mo.receiveShadow=true;return g}

/* 1 egg */
const g1=mk(Math.PI/2);
mesh(new T.CylinderGeometry(.06,.09,1.4,8),M(0x4a9a3a),0,.8,0,g1);
leaf(g1,.1,1.5,0,1.3,0,.45);leaf(g1,-.2,1.0,.3,.8,2.3,-.3);
for(let i=0;i<12;i++){const x=-.7+rnd()*1.4,z=-.25+rnd()*.5;
  const e=mesh(Sp(.075,10,8),M(0xf4f2b0,{roughness:.4}),x*.92,1.5+x*.45*.92-.13,z,g1);e.scale.y=1.25}
flower(g1,1.2,.8,.9,PC[0],.8);flower(g1,-1.1,-.8,.7,PC[1],.8);

/* 2 caterpillar */
const g2=mk(Math.PI);
mesh(new T.CylinderGeometry(.07,.1,1.1,8),M(0x4a9a3a),0,.6,0,g2);
leaf(g2,0,1.15,0,1.8,0,0);leaf(g2,.9,.8,.9,.9,.8,.2);leaf(g2,-1,.6,-.7,.8,-.9,-.2);
const cat=new T.Group();g2.add(cat);const segs=[],N=10;
for(let i=0;i<N;i++){const r=i==0?.2:(.16-Math.abs(i-4)*.008);
  const c=i==0?0x222222:[0xffd21f,0x1a1a1a,0xffffff][i%3];
  const s=mesh(Sp(r,12,8),M(c),0,0,0,cat);s.castShadow=true;segs.push(s);
  if(i>0)[-1,1].forEach(q=>mesh(new T.CylinderGeometry(.02,.02,.1),M(0xffe27a),0,-.1,q*.06,s))}
[-1,1].forEach(q=>{mesh(Sp(.025,6,4),M(0xffffff),.14,.06,q*.09,segs[0])});
flower(g2,1.3,-.9,.8,PC[2],.8);flower(g2,-1.2,.9,.9,PC[3],.8);

/* 3 pupa */
const g3=mk(Math.PI*1.5);
mesh(new T.CylinderGeometry(.07,.11,2.3,8),M(0x6b4a2a),0,1.2,0,g3);
const br=mesh(new T.CylinderGeometry(.05,.07,2.2,8),M(0x6b4a2a),0,2.5,0,g3);br.rotation.z=Math.PI/2;br.rotation.y=.2;
leaf(g3,-1,2.6,0,1.0,0,.1);leaf(g3,.95,2.65,.2,.9,3.1,-.1);leaf(g3,.2,2.9,-.4,.6,1.2,.3);
const pg=new T.Group();pg.position.set(.1,2.42,0);g3.add(pg);
const pm=M(0x9fe0a4,{roughness:.3,transparent:true});
const pup=mesh(new T.LatheGeometry([[0,0],[.12,-.04],[.28,-.22],[.36,-.5],[.32,-.82],[.2,-1.04],[.08,-1.16],[0,-1.2]].map(p=>new T.Vector2(p[0],p[1])),20),pm,0,0,0,pg);pup.castShadow=true;
mesh(new T.CylinderGeometry(.015,.03,.1),M(0x222222),0,.03,0,pg);
for(let i=0;i<6;i++){const a=i*1.047;mesh(Sp(.035,6,4),M(0xffd23f,{emissive:0xaa8800}),Math.cos(a)*.3,-.35,Math.sin(a)*.3,pg)}
flower(g3,1.2,1,.8,PC[1],.8);flower(g3,-1.1,-.9,.7,PC[0],.8);

/* wing texture */
const wtex=cvs(256,256,(x,w,h)=>{x.lineJoin='round';
  const g=x.createRadialGradient(0,128,10,0,128,250);g.addColorStop(0,'#ffb03a');g.addColorStop(1,'#f0610f');x.fillStyle=g;x.strokeStyle='#161616';x.lineWidth=9;
  x.beginPath();x.moveTo(2,118);x.bezierCurveTo(30,40,120,0,250,12);x.bezierCurveTo(245,60,200,110,150,128);x.lineTo(2,128);x.closePath();x.fill();x.stroke();
  x.beginPath();x.moveTo(2,128);x.lineTo(150,128);x.bezierCurveTo(195,150,195,215,120,242);x.bezierCurveTo(60,252,10,205,2,170);x.closePath();x.fill();x.stroke();
  x.lineWidth=5;[[240,18],[200,40],[170,80],[150,125],[170,160],[140,215],[90,230]].forEach(p=>{x.beginPath();x.moveTo(4,126);x.lineTo(p[0],p[1]);x.stroke()});
  x.fillStyle='#fff';[[236,26],[222,18],[206,34],[190,52],[176,76],[165,108],[185,160],[168,190],[140,222],[105,236],[70,232]].forEach(p=>{x.beginPath();x.arc(p[0],p[1],5,0,7);x.fill()})});
function butterfly(sc){const g=new T.Group();
  const bm=M(0x1c1c1c);
  mesh(Sp(.1,10,8),bm,0,0,0,g);const ab=mesh(new T.CylinderGeometry(.05,.035,.5,8),bm,0,0,.3,g);ab.rotation.x=Math.PI/2;
  mesh(Sp(.08,10,8),bm,0,0,-.13,g);
  [-1,1].forEach(q=>{const a=mesh(new T.CylinderGeometry(.008,.008,.4),bm,q*.09,.1,-.3,g);a.rotation.set(-.9,0,-q*.4)});
  const pr=mesh(new T.CylinderGeometry(.01,.01,.35),M(0xdddddd),0,-.1,-.3,g);pr.rotation.x=.9;
  const wm=M(0xffffff,{map:wtex,side:T.DoubleSide,transparent:true,alphaTest:.4,roughness:.6});
  const W=[];[1,-1].forEach(q=>{const w=new T.Group();w.position.x=q*.07;w.scale.x=q;g.add(w);
    const pl=mesh(new T.PlaneGeometry(1.4,1.4),wm,.7,0,.08,w);pl.rotation.x=-Math.PI/2;W.push(w)});
  g.scale.setScalar(sc);
  g.userData={W,pr,set(f,sip){W[0].rotation.z=f;W[1].rotation.z=-f;pr.scale.y=sip?1:.001}};return g}
/* 4 butterfly */
const g4=mk(0);
mesh(new T.CylinderGeometry(.08,.12,1.2,8),M(0x4a9a3a),0,.6,0,g4);
leaf(g4,0,1.2,0,1.2,.5,.2);
[[1.3,.4,1.1,PC[0]],[-1.2,.8,.9,PC[1]],[.2,1.3,1.0,PC[2]],[-.5,-1,.8,PC[3]],[1.6,-.9,.7,PC[4]]].forEach(f=>flower(g4,f[0],f[1],f[2],f[3],.9));
const sipF=flower(g4,.8,.6,1.5,0xff6fa8,1.2);
const fly=butterfly(1.2);fly.castShadow=true;scene.add(fly);g4.userData.fly=fly;stage[3].mats.push(...[]);
cur=stage[3].mats;const fly2=null;
const em=butterfly(.5);em.position.set(0,-.6,.3);pg.add(em);

/* garden */
cur=null;
for(let i=0;i<70;i++){const a=rnd()*6.283,r=i<28?1+rnd()*3.2:(i<40?7.5+rnd()*1.5:11.5+rnd()*22);
  const x=Math.cos(a)*r,z=Math.sin(a)*r;if(Math.abs(Math.hypot(x,z)-R)<1.1&&0)continue;
  const dd=[1,2,3,4].some(k=>0);flower(scene,x,z,.5+rnd()*.7,PC[i%5],.9+rnd()*.5)}
for(let i=0;i<22;i++){const a=rnd()*6.283,r=13+rnd()*24;
  const b=mesh(Sp(1+rnd()*1.2,12,8),new T.MeshStandardMaterial({color:[0x3f9b45,0x4fae55,0x2f8f5a][i%3]}),Math.cos(a)*r,.6,Math.sin(a)*r);b.scale.y=.8;b.castShadow=true}
for(let i=0;i<14;i++){const a=rnd()*6.283,r=3+rnd()*18,k=mesh(new T.DodecahedronGeometry(.3+rnd()*.3),new T.MeshStandardMaterial({color:0xa9adb3,flatShading:true}),Math.cos(a)*r,.15,Math.sin(a)*r);k.castShadow=true}
[[-16,-14,1.4],[16,-15,1.6],[-24,4,1.3],[24,-3,1.4],[-8,-24,1.7],[9,-26,1.4]].forEach(([x,z,s])=>{
  const g=new T.Group();g.position.set(x,0,z);g.scale.setScalar(s);scene.add(g);
  mesh(new T.CylinderGeometry(.35,.5,3),new T.MeshStandardMaterial({color:0x7a4a26}),0,1.5,0,g);
  [[0,4,2.2,0x2f9a4a],[1.2,3.4,1.5,0x3fae55],[-1.2,3.6,1.5,0x37a24e]].forEach(q=>{const l=mesh(Sp(q[2],14,10),new T.MeshStandardMaterial({color:q[3]}),q[0],q[1],0,g);l.castShadow=true})});
const sunS=new T.Sprite(new T.SpriteMaterial({map:cvs(128,128,(x)=>{const g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(255,250,200,1)');g.addColorStop(.3,'rgba(255,240,160,.8)');g.addColorStop(1,'rgba(255,240,160,0)');x.fillStyle=g;x.fillRect(0,0,128,128)}),fog:false}));
sunS.scale.set(40,40,1);sunS.position.set(-35,34,-60);scene.add(sunS);
const clouds=[];for(let i=0;i<7;i++){const c=new T.Group();
  for(let j=0;j<5;j++)mesh(Sp(1.4+rnd()*1.2,12,8),new T.MeshBasicMaterial({color:0xffffff}),j*1.6,rnd()*.6,rnd(),c);
  c.position.set(-50+i*15,20+rnd()*8,-40-rnd()*20);scene.add(c);clouds.push(c)}
const pet=[];for(let i=0;i<30;i++){const p=mesh(Sp(.12,6,4),new T.MeshBasicMaterial({color:[0xffb3cf,0xd9bcff,0xffffff][i%3]}),(rnd()-.5)*30,rnd()*12,(rnd()-.5)*30);p.scale.set(1,.25,.6);p.userData={s:.2+rnd()*.3,ph:rnd()*6};pet.push(p)}
/* arrows */
const am=new T.MeshStandardMaterial({color:0x7a5bd0,emissive:0x2a1a66});
for(let i=0;i<4;i++){const a0=i*Math.PI/2+.55,a1=(i+1)*Math.PI/2-.55,pts=[];
  for(let k=0;k<=16;k++){const v=P(a0+(a1-a0)*k/16);v.y=.3;pts.push(v)}
  mesh(new T.TubeGeometry(new T.CatmullRomCurve3(pts),32,.08,8),am);
  const c=mesh(new T.ConeGeometry(.3,.6,12),am);c.position.copy(P(a1));c.position.y=.3;
  c.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),new T.Vector3(Math.cos(a1),0,Math.sin(a1)))}
const tok=mesh(Sp(.2,12,8),new T.MeshBasicMaterial({color:0xffe27a}));

/* UI */
const S=[
 {n:'🥚 TRỨNG',t:'Bướm cái đẻ trứng trên cây chủ. Sau một thời gian, trứng nở thành sâu non.',a:Math.PI/2,y:1.2,d:7},
 {n:'🐛 SÂU NON',t:'Sâu non ăn lá, lớn lên và lột xác nhiều lần.',a:Math.PI,y:1.3,d:8},
 {n:'🟢 NHỘNG',t:'Sâu non hóa nhộng. Bên trong nhộng, cơ thể biến đổi để phát triển thành bướm.',a:Math.PI*1.5,y:2,d:8},
 {n:'🦋 BƯỚM TRƯỞNG THÀNH',t:'Bướm thoát khỏi nhộng, cánh khô và cứng lại, sau đó bay đi tìm mật hoa. Bướm trưởng thành sinh sản và đẻ trứng, bắt đầu vòng đời mới.',a:0,y:1.6,d:9}];
const info=document.getElementById('info'),dflt=info.innerHTML,bar=document.getElementById('stg');
const order=[0,1,2,3];let foc=-1,tourT=null;
S.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.n;b.onclick=()=>{stopTour();focus(i)};bar.appendChild(b);s.b=b});
function focus(i){foc=i;S.forEach((s,k)=>s.b.classList.toggle('on',k==i));info.innerHTML='<b>'+S[i].n+'</b>'+S[i].t}
function home(){foc=-1;S.forEach(s=>s.b.classList.remove('on'));info.innerHTML=dflt}
function stopTour(){clearInterval(tourT);tourT=null;tb.classList.remove('on')}
const tb=document.getElementById('tour');
tb.onclick=()=>{if(tourT){stopTour();return}tb.classList.add('on');let i=0;focus(0);tourT=setInterval(()=>{i++;if(i>3){stopTour();home();return}focus(i)},7000)};
document.getElementById('home').onclick=()=>{stopTour();home()};
/* sound */
let ac=null,on=false,mg;const sb=document.getElementById('snd');
sb.onclick=()=>{on=!on;sb.classList.toggle('on',on);sb.textContent='Âm thanh: '+(on?'Bật':'Tắt');
  if(on&&!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.connect(ac.destination);
    const b=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const n=ac.createBufferSource();n.buffer=b;n.loop=true;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=500;const gn=ac.createGain();gn.gain.value=.05;n.connect(f);f.connect(gn);gn.connect(mg);n.start();
    setInterval(()=>{if(!on||Math.random()<.4)return;const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime,f0=2200+Math.random()*1500;
      o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f0*1.4,t+.12);o.frequency.exponentialRampToValueAtTime(f0*.9,t+.25);
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.05,t+.04);g.gain.exponentialRampToValueAtTime(.0001,t+.3);o.connect(g);g.connect(mg);o.start(t);o.stop(t+.32)},900)}catch(e){}}
  if(mg)mg.gain.value=on?1:0};
/* camera */
let th=.3,ph=.6,dist=27,tdist=27,tgt=new T.Vector3(0,1.5,0),ttgt=new T.Vector3(0,1.5,0);
const cv=renderer.domElement,ptr=new Map();let pd=0;
cv.onpointerdown=e=>{ptr.set(e.pointerId,[e.clientX,e.clientY]);cv.setPointerCapture(e.pointerId);pd=0};
cv.onpointerup=cv.onpointercancel=e=>ptr.delete(e.pointerId);
cv.onpointermove=e=>{const o=ptr.get(e.pointerId);if(!o)return;
  if(ptr.size==2){const q=[...ptr.entries()].find(k=>k[0]!=e.pointerId)[1];const d=Math.hypot(e.clientX-q[0],e.clientY-q[1]);if(pd)tdist=Math.min(45,Math.max(5,tdist*pd/d));pd=d}
  else{th-=(e.clientX-o[0])*.006;ph=Math.min(1.35,Math.max(.1,ph+(e.clientY-o[1])*.005));if(foc>=0)foc=-2}
  ptr.set(e.pointerId,[e.clientX,e.clientY])};
cv.addEventListener('wheel',e=>{e.preventDefault();tdist=Math.min(45,Math.max(5,tdist+e.deltaY*.02))},{passive:false});
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const ss=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)};
let oc=new T.Vector3(),orr=8;const clock=new T.Clock(),v=new T.Vector3(),vp=new T.Vector3();
function loop(){const t=clock.getElapsedTime();
  /* camera */
  if(foc>=0){const s=S[foc];ttgt.copy(P(s.a));ttgt.y=s.y;tdist=s.d+(innerWidth<innerHeight?4:0);let d=s.a+Math.PI-th;d=Math.atan2(Math.sin(d),Math.cos(d));if(!ptr.size)th+=d*.05;ph+=(.35-ph)*.03}
  else if(foc==-1){ttgt.set(0,1.5,0);if(!ptr.size)th+=.0012;if(tdist<18)tdist=27}
  tgt.lerp(ttgt,.06);dist+=(tdist-dist)*.07;
  camera.position.set(tgt.x+dist*Math.sin(th)*Math.cos(ph),tgt.y+dist*Math.sin(ph),tgt.z+dist*Math.cos(th)*Math.cos(ph));camera.lookAt(tgt);
  /* stage dim / zoom */
  stage.forEach((s,i)=>{const k=foc<0?1:(i==foc?1.1:.4);s.k+=(k-s.k)*.07;const z=foc==i?1.5:1;s.sc+=(z-s.sc)*.07;s.g.scale.setScalar(s.sc);
    const em=Math.max(0,s.k-1)*1.6;s.mats.forEach(o=>{o.m.color.copy(o.b).multiplyScalar(Math.min(s.k,1)+Math.max(0,s.k-1));if(o.m.emissive)o.m.emissive.copy(o.b).multiplyScalar(em*.3)})});
  /* eggs: shimmer */
  g1.rotation.y=Math.sin(t*.5)*.05;
  /* caterpillar crawl & grow */
  const cy=(t%24)/24,gs=.75+cy*.5,hx=Math.sin(t*.25)*.7;
  cat.position.set(hx,1.27,0);cat.scale.setScalar(gs*(cy>.97?.8:1));
  segs.forEach((s,i)=>{const w=Math.sin(t*3.5-i*.7);s.position.set(-i*.2*(1-.1*w*0)+(i==0?0:0),.16+Math.max(0,w)*.07,0);if(i==0)s.position.y=.2+Math.abs(Math.sin(t*6))*.04});
  cat.rotation.y=Math.cos(t*.25)>0?0:Math.PI;
  /* pupa */
  const tt=t%16;pg.rotation.z=Math.sin(t*.9)*.05;
  pm.opacity=1-.65*(ss(2,5,tt)-ss(12,13.5,tt));pm.color.setHex(0x9fe0a4).lerp(new T.Color(0xcfa070),ss(2,5,tt)-ss(12,13.5,tt));
  const es=ss(5,8,tt)*(1-ss(12.5,14.5,tt));em.scale.setScalar(.5*es+.001);em.position.y=-.5-ss(5,8,tt)*.35;em.rotation.set(0,Math.PI,0);em.userData.set(.25+Math.sin(t*1.5)*.25*ss(8,12,tt),false);
  /* butterfly flight */
  const p=t%18,w=ss(10,12,p)-ss(16,17.5,p),fo=foc==3?1:0;
  oc.lerp(foc==3?P(0).setY(2.6):v.set(0,3.2,0),.03);orr+=((fo?2.4:8)-orr)*.03;
  vp.set(oc.x+orr*Math.sin(t*.32),oc.y+Math.sin(t*.8)*.8,oc.z+orr*Math.sin(t*.47+1));
  sipF.children[2]||0;const fp=new T.Vector3();sipF.updateMatrixWorld();sipF.localToWorld(fp.set(0,1.5,0));fp.y+=.35;
  const prev=fly.position.clone();fly.position.lerpVectors(vp,fp,w);
  const dv=fly.position.clone().sub(prev);if(dv.lengthSq()>1e-7&&w<.9)fly.rotation.y=Math.atan2(-dv.x,-dv.z);
  fly.rotation.x=w>.5?0:-.15;
  fly.userData.set(w>.9?.5+Math.sin(t*3)*.5*.5:.2+Math.sin(t*16)*.9,w>.9);
  tok.position.copy(P(t*.35));tok.position.y=.6+Math.sin(t*6)*.08;
  clouds.forEach((c,i)=>{c.position.x+=.01+i*.002;if(c.position.x>60)c.position.x=-60});
  pet.forEach(q=>{q.position.y-=q.userData.s*.02;q.position.x+=Math.sin(t+q.userData.ph)*.01;q.rotation.z=t+q.userData.ph;if(q.position.y<0)q.position.y=12});
  renderer.render(scene,camera);requestAnimationFrame(loop)}
loop();
